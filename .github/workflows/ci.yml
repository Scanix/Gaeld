name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce public CE boundary
        run: |
          forbidden=("plugins/gaeld-ee" "deploy.php" ".gitlab-ci.yml" "resources/js/Pages/SaasAdmin" "resources/js/Components/SaasAdmin")
          for forbidden_path in "${forbidden[@]}"; do
            if [ -e "$forbidden_path" ]; then
              echo "Private SaaS/EE path must not be present in the public repository: $forbidden_path"
              exit 1
            fi
          done

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, curl, zip

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install NPM dependencies
        run: pnpm install

      - name: Build Vite assets
        run: pnpm build

      - name: Run linter (Pint)
        run: composer lint

      - name: Run static analysis (PHPStan)
        run: composer stan

      - name: Audit Composer dependencies
        continue-on-error: true
        run: composer audit --no-dev

      - name: Audit NPM dependencies
        run: pnpm audit --prod || true

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          # Feature tests split into 2 balanced groups to stay under 120s timeout
          - name: 'Feature (Group 1)'
            test-paths: 'tests/Feature/Accounting tests/Feature/Migration tests/Feature/Console'
          - name: 'Feature (Group 2)'
            test-paths: 'tests/Feature/Organizations tests/Feature/Invoicing tests/Feature/Api tests/Feature/Reporting tests/Feature/Expenses tests/Feature/Banking tests/Feature/Users tests/Feature/Payroll tests/Feature/Contacts tests/Feature/Auth tests/Feature/Assets tests/Feature/Seeders tests/Feature/Security tests/Feature/Dashboard tests/Feature/Billing tests/Feature/SaasAdmin'
          # Non-Feature suites
          - name: 'Unit'
            test-paths: 'tests/Unit'
          - name: 'Security'
            test-paths: 'tests/Security'
          - name: 'Performance'
            test-paths: 'tests/Performance'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaeld
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gaeld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, curl, zip
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install NPM dependencies
        run: pnpm install

      - name: Build Vite assets
        run: pnpm build

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gaeld_test
          DB_USERNAME: gaeld
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run ${{ matrix.name }} tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gaeld_test
          DB_USERNAME: gaeld
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit --configuration phpunit.xml ${{ matrix.test-paths }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: |
            coverage/clover.xml
            junit.xml
          retention-days: 14

