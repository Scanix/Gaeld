name: CI

on:
  workflow_call:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce public CE boundary
        run: |
          forbidden=("plugins/gaeld-ee" "deploy.php" ".gitlab-ci.yml" "resources/js/Pages/SaasAdmin" "resources/js/Components/SaasAdmin")
          for forbidden_path in "${forbidden[@]}"; do
            if [ -e "$forbidden_path" ]; then
              echo "Private SaaS/EE path must not be present in the public repository: $forbidden_path"
              exit 1
            fi
          done

      - name: Audit clean CE artifact
        run: |
          bash ./scripts/qa/test-ce-artifact.sh
          git archive --format=tar.gz --output=/tmp/gaeld-ce.tar.gz HEAD
          ./scripts/qa/check-ce-artifact.sh /tmp/gaeld-ce.tar.gz

      - name: Distribution failure and encryption tests
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          python3 -m unittest discover -s tests/distribution -v

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, curl, zip

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Check staging URL handling
        run: node --test scripts/qa/staging-urls.test.mjs

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite assets
        run: pnpm build

      - name: Run linter (Pint)
        run: composer lint

      - name: Run static analysis (PHPStan)
        run: composer stan

      - name: Audit Composer dependencies
        run: composer audit --locked --abandoned=report

      - name: Audit NPM dependencies
        run: pnpm audit

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        name: ['Feature (Group 1)', 'Feature (Group 2)', Unit, Security, Performance]

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: gaeld
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_USER: gaeld
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, curl, zip
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite assets
        run: pnpm build

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run ${{ matrix.name }} PHPUnit tests
        if: matrix.name != 'Performance'
        env:
          SUITE: ${{ matrix.name }}
          APP_DEBUG: true
          SESSION_DRIVER: array
        run: |
          case "$SUITE" in
            'Feature (Group 1)'|'Feature (Group 2)')
              paths=()
              for path in tests/Feature/*; do
                [[ -d "$path" || "$path" == *Test.php ]] || continue
                case "${path##*/}" in
                  Accounting|Migration|Console) group='Feature (Group 1)' ;;
                  *) group='Feature (Group 2)' ;;
                esac
                [[ "$group" != "$SUITE" ]] || paths+=("$path")
              done
              ;;
            *) paths=("tests/$SUITE") ;;
          esac
          (( ${#paths[@]} > 0 ))
          vendor/bin/phpunit --configuration phpunit.xml --fail-on-empty-test-suite --log-junit junit.xml "${paths[@]}"

      - name: Run authenticated k6 dashboard smoke
        if: matrix.name == 'Performance'
        env:
          APP_URL: http://127.0.0.1:18765
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan db:seed --force
          organization=$(PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" \
            -XAt -v ON_ERROR_STOP=1 -c "SELECT id FROM organizations WHERE name='Demo GmbH'")
          test -n "$organization"
          token=$(php artisan gaeld:token "$organization" --name=ci-dashboard --expires-in-days=1 \
            --abilities=accounts:read --abilities=customers:read --abilities=invoices:read --abilities=expenses:read --no-ansi)
          K6_API_TOKEN=$(awk '$1 == "Token" { print $NF }' <<<"$token")
          test -n "$K6_API_TOKEN"
          export K6_API_TOKEN
          php artisan serve --host=127.0.0.1 --port=18765 >"$RUNNER_TEMP/dashboard-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused "$APP_URL/up"
          docker run --rm --network host -v "$PWD/tests/Performance:/tests:ro" \
            -e K6_BASE_URL="$APP_URL" -e K6_API_TOKEN \
            grafana/k6@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276 \
            run /tests/dashboard-smoke.js

      - name: Install pinned archival proof tools
        if: matrix.name == 'Unit'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript openjdk-21-jre-headless unzip
          curl --fail --location --proto '=https' --proto-redir '=https' https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.4-installer.zip -o /tmp/verapdf.zip
          echo '04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23  /tmp/verapdf.zip' | sha256sum -c -
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          sudo java -jar /tmp/verapdf-installer/verapdf-greenfield-1.30.4/verapdf-izpack-installer-1.30.4.jar docker/production/verapdf-install.xml
          test -x /opt/verapdf/verapdf
          test -f /usr/share/color/icc/ghostscript/srgb.icc
          gs --version
          /opt/verapdf/verapdf --version

      - name: Require real PDF/A, CMS, timestamp and renewal integration
        if: matrix.name == 'Unit'
        env:
          ARCHIVE_VERAPDF_BINARY: /opt/verapdf/verapdf
          ARCHIVE_ICC_PROFILE: /usr/share/color/icc/ghostscript/srgb.icc
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit --fail-on-skipped tests/Unit/Proof/ProofProfileIntegrationTest.php

      - name: Upload test results
        if: always() && matrix.name != 'Performance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.name }}
          path: |
            coverage/clover.xml
            junit.xml
          retention-days: 14
