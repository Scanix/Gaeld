name: CE source provenance

on:
  push:
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Source version, for example 3.10.0'
        required: true
        type: string
      expected-commit:
        description: 'Full Git commit accepted for this build'
        required: true
        type: string

permissions: {}

jobs:
  source:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and audit the CE source archive
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#release/v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]]
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/qa/test-ce-artifact.sh
          mkdir -p release "$RUNNER_TEMP/ce-source"
          name="gaeld-ce-v${version}.tar.gz"
          git archive --format=tar.gz --prefix="gaeld-ce-${version}/" --output="release/$name" HEAD
          bash scripts/qa/check-ce-artifact.sh "release/$name"
          gzip -dc "release/$name" > "$RUNNER_TEMP/ce-source.tar"
          test "$(git get-tar-commit-id < "$RUNNER_TEMP/ce-source.tar")" = "$GITHUB_SHA"
          tar -xf "$RUNNER_TEMP/ce-source.tar" -C "$RUNNER_TEMP/ce-source"
          (cd release && sha256sum "$name" > "$name.sha256" && sha256sum --check "$name.sha256")
          echo "CE_SOURCE_NAME=$name" >> "$GITHUB_ENV"

      - name: Generate an SPDX inventory from the audited source archive
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/ce-source
          syft-version: v1.57.2
          format: spdx-json
          output-file: release/gaeld-ce.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Confirm the inventory includes PHP and frontend dependencies
        run: |
          jq -e '(.spdxVersion | startswith("SPDX-")) and
            any(.packages[]; .name == "laravel/framework") and
            any(.packages[]; .name == "vite")' release/gaeld-ce.spdx.json

      - name: Attest the archive, portable checksum and dependency inventory
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Verify the signer, source commit and each artifact
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "release/$CE_SOURCE_NAME" "release/$CE_SOURCE_NAME.sha256" release/gaeld-ce.spdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ce-source.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
          done
          cp "$BUNDLE" release/gaeld-ce.provenance.jsonl

      - name: Retain the verified distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ce-source-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
