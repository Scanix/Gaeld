[global]
daemonize = no
error_log = syslog
syslog.ident = gaeld-fpm
[www]
user = www-data
group = www-data
listen = /run/gaeld-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
clear_env = no
chdir = @ROOT@/current
catch_workers_output = yes
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_terminate_timeout = 300s
